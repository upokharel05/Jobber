# Local development infrastructure. The broker and Redis are added in the steps where we choose them.
services:
  postgres:
    image: postgres:16
    container_name: jobber-postgres
    environment:
      POSTGRES_DB: jobber
      POSTGRES_USER: jobber
      POSTGRES_PASSWORD: jobber   # dev-only credentials
    ports:
      - "5433:5432"   # host 5433: avoids clashing with other local Postgres instances
    volumes:
      - jobber-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobber -d jobber"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jobber-pgdata:
