# Local development infrastructure. Redis is added in the step where we need it.
services:
  postgres:
    image: postgres:16
    container_name: jobber-postgres
    environment:
      POSTGRES_DB: jobber
      POSTGRES_USER: jobber
      POSTGRES_PASSWORD: jobber   # dev-only credentials
    ports:
      - "5433:5432"   # host 5433: avoids clashing with other local Postgres instances
    volumes:
      - jobber-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobber -d jobber"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    container_name: jobber-rabbitmq
    environment:
      # The default "guest" user may only connect from inside the container, so define our own.
      RABBITMQ_DEFAULT_USER: jobber
      RABBITMQ_DEFAULT_PASS: jobber   # dev-only credentials
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI: http://localhost:15672
    volumes:
      - jobber-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 10

volumes:
  jobber-pgdata:
  jobber-rabbitmq:
