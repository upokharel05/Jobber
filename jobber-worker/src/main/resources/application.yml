spring:
  application:
    name: jobber-worker
  # Defaults match docker-compose.yml; override with env vars in other environments.
  # The worker never migrates the schema; jobber-api owns it.
  datasource:
    url: ${JOBBER_DB_URL:jdbc:postgresql://localhost:5433/jobber}
    username: ${JOBBER_DB_USERNAME:jobber}
    password: ${JOBBER_DB_PASSWORD:jobber}
  rabbitmq:
    host: ${JOBBER_RABBIT_HOST:localhost}
    port: ${JOBBER_RABBIT_PORT:5672}
    username: ${JOBBER_RABBIT_USERNAME:jobber}
    password: ${JOBBER_RABBIT_PASSWORD:jobber}
    listener:
      simple:
        # Deliberately minimal until we design worker concurrency: one job at a time,
        # one unacknowledged message held at a time.
        concurrency: 1
        prefetch: 1
        # A message the listener rejects is not requeued (that would loop); RabbitMQ dead-letters it
        # to jobber.jobs.dead instead. Job failures never get here: they are recorded in Postgres.
        default-requeue-rejected: false

jobber:
  worker:
    # A claimed job is ours until the lease expires; the heartbeat keeps extending it while we run.
    lease-duration: 30s
    heartbeat-interval: 10s
  retry:
    # Delay after attempt n: min(max-delay, base-delay * 2^(n-1)), randomized to 50-100% of that.
    # Shared with jobber-api, which uses it when recovering jobs from dead workers; keep them equal.
    base-delay: 10s
    max-delay: 10m

# Different port from the API so both can run on one machine during development.
server:
  port: 8081
